[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/builder-app",
    "crates/builder-generator",
    "crates/builder-playground",
    "crates/builder-project",
    "crates/mcp-native-fs",
    "crates/mcp-policy",
    "crates/mcp-runtime",
    "crates/mcp-starter-adapters",
    "crates/mcp-transport",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
builder-app = { path = "crates/builder-app" }
builder-generator = { path = "crates/builder-generator" }
builder-playground = { path = "crates/builder-playground" }
builder-project = { path = "crates/builder-project" }
mcp-policy = { path = "crates/mcp-policy" }
mcp-runtime = { path = "crates/mcp-runtime" }
mcp-starter-adapters = { path = "crates/mcp-starter-adapters" }
mcp-transport = { path = "crates/mcp-transport" }

clap = { version = "=4.6.7", features = ["derive"] }
rmcp = { version = "=3.9.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
