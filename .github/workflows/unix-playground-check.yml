name: Unix playground candidate

on:
  push:
    branches: [codex/unix-playground-check]

permissions:
  contents: read

jobs:
  headless:
    name: Headless playground (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe Darwin process-group behavior after clean exit
        run: |
          cat > "$RUNNER_TEMP/group.c" <<'C'
          #include <errno.h>
          #include <libproc.h>
          #include <signal.h>
          #include <spawn.h>
          #include <stdio.h>
          #include <sys/wait.h>
          #include <unistd.h>
          extern char **environ;
          int main(void) {
            posix_spawnattr_t attr;
            pid_t leader = 0;
            siginfo_t info = {0};
            int pids[2] = {0, 0};
            char *const argv[] = {"true", NULL};
            if (posix_spawnattr_init(&attr) ||
                posix_spawnattr_setflags(&attr, POSIX_SPAWN_SETPGROUP) ||
                posix_spawnattr_setpgroup(&attr, 0) ||
                posix_spawn(&leader, "/usr/bin/true", NULL, &attr, argv, environ) ||
                waitid(P_PID, (id_t)leader, &info, WEXITED | WNOWAIT) ||
                info.si_pid != leader) {
              return 1;
            }
            int entries = proc_listpgrppids(leader, pids, sizeof(pids));
            errno = 0;
            int signaled = killpg(leader, SIGKILL);
            int signal_errno = errno;
            printf("Exited group leader=%d members=%d first=%d killpg=%d errno=%d\n",
                   leader, entries, pids[0], signaled, signal_errno);
            return waitpid(leader, NULL, 0) == leader ? 0 : 2;
          }
          C
          cc "$RUNNER_TEMP/group.c" -o "$RUNNER_TEMP/group"
          "$RUNNER_TEMP/group"
      - name: Check format
        run: cargo fmt --all --check
      - name: Run Unix launch and transport tests
        run: cargo test --locked -p builder-playground
      - name: Replay both MCP revisions in the native CLI
        run: |
          cargo test --locked -p mcp-builder --test managed_playground real_cli_replays_both_revisions_and_rejects_stale_approval
          cargo test --locked -p mcp-builder --test mvp_cli replay::
      - name: Check the Linux live playground
        if: runner.os == 'Linux'
        run: cargo test --locked -p mcp-builder --test managed_playground
      - name: Check all targets with Clippy
        run: cargo clippy --locked -p builder-playground -p mcp-builder --all-targets -- -D warnings
