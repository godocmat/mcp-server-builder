[package]
name = "mcp-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[features]
server-stdio = [
    "dep:rmcp",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "rmcp/server",
    "rmcp/transport-io",
]

[dependencies]
mcp-runtime.workspace = true
rmcp = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt", "sync", "time"], optional = true }
tokio-util = { version = "=0.7.20", optional = true }
tracing = { workspace = true, optional = true }

[lints.rust]
# The shared source also has a conditional HTTP implementation in the builder.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("server-http"))'] }
