[package]
name = "mcp-standalone-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[workspace]
resolver = "3"
members = [
    "crates/builder-project",
    "crates/mcp-policy",
    "crates/mcp-runtime",
    "crates/mcp-starter-adapters",
    "crates/mcp-transport",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
builder-project = { path = "crates/builder-project" }
mcp-policy = { path = "crates/mcp-policy" }
mcp-runtime = { path = "crates/mcp-runtime" }
mcp-starter-adapters = { path = "crates/mcp-starter-adapters" }
mcp-transport = { path = "crates/mcp-transport" }
rmcp = { version = "=3.9.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }

[dependencies]
builder-project.workspace = true
mcp-policy.workspace = true
mcp-runtime.workspace = true
mcp-starter-adapters.workspace = true
mcp-transport = { workspace = true, features = ["server-stdio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["net", "rt", "time"] }
uuid.workspace = true
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
