[package]
name = "mcp-starter-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
fluent-uri = "=0.4.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
mcp-policy.workspace = true
mcp-runtime.workspace = true
percent-encoding = "=2.3.2"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["net", "rt", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tracing.workspace = true
uuid.workspace = true
webpki-roots = "=1.0.11"
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
builder-project.workspace = true
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "time"] }
