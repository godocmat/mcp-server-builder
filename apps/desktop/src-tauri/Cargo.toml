[package]
name = "mcp-builder-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
builder-app.workspace = true
builder-project.workspace = true
dunce = "=1.0.5"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.1", features = ["sync", "time"] }
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize = { version = "=1.9.1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
ci-webdriver = ["dep:tauri-plugin-wdio-webdriver"]
